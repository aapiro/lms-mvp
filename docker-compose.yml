
services:
  postgres:
    image: postgres:18-alpine
    container_name: lms-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lmsdb}
      POSTGRES_USER: ${POSTGRES_USER:-lmsuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-38fc11a0b3eb3fd615d7c2c68fe0dd4e}
    ports:
      - "5432:5432"
    volumes:
      # postgres:18+ images expect the mount at /var/lib/postgresql (data lives
      # in a versioned subdirectory, enabling pg_upgrade --link)
      - postgres_data:/var/lib/postgresql
    networks:
      - lms-network

  minio:
    image: minio/minio:latest
    container_name: lms-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-lmsminio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-76a118ab4edabd39256569b0261f070a}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - lms-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    build: ./backend
    container_name: lms-backend
    environment:
      SPRING_PROFILES_ACTIVE: dev
      # E2E suites fire many logins per minute from one IP; keep the limiter off
      # in the dev/E2E stack (defaults to enabled elsewhere)
      RATELIMIT_ENABLED: "false"
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-lmsdb}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-lmsuser}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-38fc11a0b3eb3fd615d7c2c68fe0dd4e}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-lmsminio}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-76a118ab4edabd39256569b0261f070a}
      MINIO_BUCKET: lms-content
      # Public endpoint used to make presigned URLs reachable from host/browser
      MINIO_PUBLIC_ENDPOINT: http://host.docker.internal:9000
      # Dev-grade default (any committed value is public); override via .env in real deployments
      JWT_SECRET: ${JWT_SECRET:-4yBbW4T72DCsfw2iglan/ggrjbcw+V90ZvwBoCn7iP9BlAt6u4wemQgou1U3IZnL}
      STRIPE_SECRET_KEY: sk_test_your_stripe_secret_key
      STRIPE_WEBHOOK_SECRET: whsec_your_webhook_secret
      FRONTEND_URL: http://localhost:3000
    ports:
      - "8080:8080"
    depends_on:
      - postgres
      - minio
    networks:
      - lms-network

  frontend:
    build:
      context: ./frontend
      args:
        REACT_APP_ENABLE_DEV_LOGIN: ${REACT_APP_ENABLE_DEV_LOGIN:-false}
    container_name: lms-frontend
    environment:
      REACT_APP_API_URL: http://localhost:8080/api
      REACT_APP_STRIPE_PUBLIC_KEY: pk_test_your_stripe_public_key
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - lms-network

volumes:
  postgres_data:
  minio_data:

networks:
  lms-network:
    driver: bridge
