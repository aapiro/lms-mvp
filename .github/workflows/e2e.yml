name: E2E

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Placeholder media for minio-init
        run: |
          mkdir -p media-resources
          printf 'placeholder' > media-resources/sample-mp4-files-sample_960x540.mp4
          printf 'placeholder' > media-resources/sample-pdf-file.pdf

      - name: Start stack
        run: docker compose up --build -d

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install Playwright deps
        working-directory: e2e
        run: npm ci

      - name: Install browsers
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        working-directory: e2e
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3000
          PLAYWRIGHT_API_URL: http://localhost:8080/api
        run: npx playwright test

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report/
