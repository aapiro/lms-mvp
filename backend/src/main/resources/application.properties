spring.application.name=lms-backend

# Database
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=false
spring.flyway.locations=classpath:db/migration_clean

# File Upload
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB

# Tomcat header size (raise from 8KB default; PDF presigned URLs + JWT bloat headers)
server.max-http-request-header-size=64KB
server.tomcat.max-http-response-header-size=64KB

# MinIO
minio.endpoint=${MINIO_ENDPOINT}
minio.access-key=${MINIO_ACCESS_KEY}
minio.secret-key=${MINIO_SECRET_KEY}
minio.bucket=${MINIO_BUCKET}

jwt.secret=${JWT_SECRET:lms-local-dev-jwt-secret-at-least-32-chars}
jwt.expiration=86400000

# Stripe
stripe.secret-key=${STRIPE_SECRET_KEY}
stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET}

# CORS
frontend.url=${FRONTEND_URL}
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# AI Grading
ai.grading.enabled=${AI_GRADING_ENABLED:false}
ai.grading.api-key=${AI_GRADING_API_KEY:}

# AI Tutor
ai.tutor.enabled=${AI_TUTOR_ENABLED:false}
ai.tutor.api-key=${AI_TUTOR_API_KEY:}
ai.tutor.model=${AI_TUTOR_MODEL:claude-sonnet-4-20250514}

# Email (SMTP)
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
mail.from=${MAIL_FROM:noreply@lms-platform.com}
mail.enabled=${MAIL_ENABLED:false}
# Solo incluir el SMTP en /actuator/health cuando el mail está activo;
# sin credenciales el MailHealthIndicator tumbaba el health completo a DOWN
management.health.mail.enabled=${MAIL_ENABLED:false}

# Actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized

# Server
server.port=8080
