# TestContainers provides datasource dynamically
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=false
spring.flyway.locations=classpath:db/migration_clean

# JWT
jwt.secret=test-jwt-secret-at-least-32-characters-long-for-hmac
jwt.expiration=86400000

# Stripe (faked in tests)
stripe.secret-key=sk_test_fake_key_for_testing
stripe.webhook-secret=whsec_test_fake_secret

# CORS
frontend.url=http://localhost:3000
cors.allowed-origins=http://localhost:3000

# MinIO (mocked in tests)
minio.endpoint=http://localhost:9000
minio.access-key=test
minio.secret-key=test
minio.bucket=test-bucket

# AI (disabled in tests)
ai.grading.enabled=false
ai.grading.api-key=fake
ai.tutor.enabled=false
ai.tutor.api-key=fake
ai.tutor.model=claude-sonnet-4-20250514

ratelimit.enabled=false
